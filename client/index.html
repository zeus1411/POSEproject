<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaticCaps - Aquascaping Excellence | Thế giới Thủy sinh Cao cấp</title>
    <meta name="description" content="Khám phá sản phẩm cây thủy sinh, cá cảnh và phụ kiện chất lượng cao. Tạo nên những layout bể thủy sinh đẹp hoàn hảo với AquaticCaps.">
    <meta name="keywords" content="thủy sinh, aquascaping, cây nước, cá cảnh, bể cá, phụ kiện thủy sinh">
    <script>
      (() => {
        try {
          const storageKey = 'aquaticcaps-theme';
          const defaultTheme = 'dark';
          const validThemes = ['light', 'dark'];
          const storedTheme = localStorage.getItem(storageKey);
          const theme = validThemes.includes(storedTheme) ? storedTheme : defaultTheme;
          const root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
