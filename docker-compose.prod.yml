services:
  mongodb:
    image: mongo:7.0
    container_name: pose_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: h3ok1lpwGW8JvMFD
      MONGO_INITDB_DATABASE: AquaticStorePOSE
    volumes:
      - mongodb_data:/data/db
    networks:
      - pose_network

  redis:
    image: redis:7-alpine
    container_name: pose_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - pose_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pose_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pose_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    container_name: pose_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - ./server/.env.production
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/public/uploads:/app/public/uploads
    networks:
      - pose_network
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: pose_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - pose_network
    depends_on:
      - backend

networks:
  pose_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
